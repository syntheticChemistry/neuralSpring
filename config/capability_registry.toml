# SPDX-License-Identifier: AGPL-3.0-or-later
#
# neuralSpring capability registry.
#
# Single source of truth for capabilities advertised via `capability.list`.
# Consumed by `neuralspring` binary at startup and by biomeOS deploy graphs.
# Mirrors src/config.rs::ALL_CAPABILITIES — keep in sync or generate from
# this file at build time.
#
# Stability tiers (from primalSpring Wave 20 PM):
#   stable   — deployed consumers depend on this name; do not rename
#   evolving — name may change between major waves; notify downstream
#   internal — test fixture or internal-only; no stability guarantee
#
# See: wateringHole/SPRING_AS_NICHE_DEPLOYMENT_STANDARD.md

[primal]
family = "neural-spring"
display_name = "neuralSpring"
domain = "science"
version = "0.1.0"

[capabilities]

# ── science.* (niche domain — neuralSpring owns these names) ──

[capabilities.spectral_analysis]
method = "science.spectral_analysis"
description = "Weight matrix spectral analysis (eigenvalues, IPR, level spacing)"
stability = "stable"

[capabilities.anderson_localization]
method = "science.anderson_localization"
description = "Anderson localization regime classification and disorder sweeps"
stability = "stable"

[capabilities.hessian_eigen]
