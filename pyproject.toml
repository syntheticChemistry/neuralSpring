[project]
name = "neuralspring-control"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = [
  "E501",   # line length — handled by formatter
  "E402",   # import not at top — required for sys.path manipulation (airSpring)
  "N803",   # uppercase argument names — scientific convention (X_train, U_sensors, etc.)
  "N806",   # uppercase variable in function — mathematical notation (Q, K, V, etc.)
]
