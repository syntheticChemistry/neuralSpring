# SPDX-License-Identifier: AGPL-3.0-or-later

[workspace]
members = [
    ".",
    "metalForge/forge",
    "playGround",
    "experiments/exp094_neuralspring_composition_parity",
]

[workspace.dependencies]
barracuda = { path = "../../primals/barraCuda/crates/barracuda", default-features = false, features = [
    "gpu",
    "domain-nn",
    "domain-esn",
    "domain-genomics",
    "domain-timeseries",
    "domain-lattice",
] }
bytemuck = { version = "1.21", features = ["derive"] }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
log = "0.4"
thiserror = "2"
wgpu = { version = "28", default-features = false, features = ["wgsl", "vulkan-portability"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
temp-env = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "warn"

[package]
name = "neural-spring"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-or-later"
publish = false
description = "Validation harness proving BarraCUDA Rust/WGSL primitives reproduce Python ML baselines"
repository = "https://github.com/ecoPrimals/neuralSpring"

[dependencies]
barracuda = { workspace = true, optional = true }
neural-spring-forge = { path = "metalForge/forge", optional = true }
bytemuck = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "signal", "fs", "time", "process"] }
log = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
tarpc = { version = "0.37", features = ["tokio1", "serde-transport"], optional = true }
primalspring = { path = "../primalSpring/ecoPrimal", optional = true }

[features]
default = []
# IPC-first: default build links no GPU library. Opt in with:
#   cargo build --features barracuda
# barraCuda library linking — enables GPU validation, tensor ops, and all
# barracuda-dependent modules.
barracuda = ["dep:barracuda", "dep:neural-spring-forge", "dep:wgpu"]
primal = ["anyhow", "clap", "env_logger", "tarpc"]
composed = ["primal"]
guidestone = ["primalspring", "primal"]

[dev-dependencies]
approx = "0.5"
proptest = "1"
serial_test = "3"
temp-env = { workspace = true }

# Validation binaries follow the hotSpring pattern:
# - ValidationHarness with check_abs / check_rel / check_abs_or_rel
# - Hardcoded expected values from provenance.rs
# - Tolerances from tolerances.rs (no ad-hoc magic numbers)
# - Exit code 0 (all pass) or 1 (any fail)

