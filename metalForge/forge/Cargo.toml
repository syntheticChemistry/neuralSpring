[package]
name = "neural-spring-forge"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "ML dispatch, substrate discovery, workload tracking, and BarraCUDA bridge for ToadStool absorption"
repository = "https://github.com/ecoPrimals/neuralSpring"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Justified: inline format args are clearer in GPU dispatch code.
uninlined_format_args = "allow"

[features]
default = []
coralreef = ["dep:coral-reef"]

[dependencies]
barracuda = { path = "../../../barraCuda/crates/barracuda" }
bytemuck = { version = "1.14", features = ["derive"] }
coral-reef = { path = "../../../coralReef/crates/coral-reef", optional = true }
pollster = "0.4"
serde_json = "1"
wgpu = { version = "28", default-features = false, features = [
    "wgsl",
    "vulkan-portability",
] }

[dev-dependencies]
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
