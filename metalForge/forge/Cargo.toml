[package]
name = "neural-spring-forge"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-or-later"
publish = false
description = "ML dispatch, substrate discovery, workload tracking, and BarraCUDA bridge for ToadStool absorption"
repository = "https://github.com/ecoPrimals/neuralSpring"

[lints]
workspace = true

[features]
default = []
coralreef = ["dep:coral-reef"]

[dependencies]
barracuda = { workspace = true }
bytemuck = { workspace = true }
coral-reef = { path = "../../../../primals/coralReef/crates/coral-reef", optional = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
thiserror = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
