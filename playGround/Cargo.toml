# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "neuralspring-playground"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-or-later"
publish = false
description = "Application sandbox: Squirrel MCP adapter, interactive experiment runner, primal IPC client"
repository = "https://github.com/ecoPrimals/neuralSpring"

[dependencies]
anyhow = "1"
barracuda = { path = "../../../primals/barraCuda/crates/barracuda", default-features = false, features = [
    "gpu",
    "domain-nn",
    "domain-esn",
    "domain-genomics",
    "domain-timeseries",
    "domain-lattice",
] }
neural-spring = { path = ".." }
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "io-std",
    "net",
    "signal",
    "fs",
    "time",
] }
toml = "0.8"
wgpu = { version = "28", default-features = false }

[lints]
workspace = true

[[bin]]
name = "neuralspring_mcp_adapter"
path = "src/bin/neuralspring_mcp_adapter.rs"

[[bin]]
name = "neuralspring_interactive"
path = "src/bin/neuralspring_interactive.rs"

[[bin]]
name = "neuralspring_model_lab"
path = "src/bin/neuralspring_model_lab.rs"

[[bin]]
name = "neuralspring_bench_inference"
path = "src/bin/neuralspring_bench_inference.rs"

[[bin]]
name = "neuralspring_compute_probe"
path = "src/bin/neuralspring_compute_probe.rs"

[dev-dependencies]
temp-env = "0.3.6"
