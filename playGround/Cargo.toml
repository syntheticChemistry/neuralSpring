# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "neuralspring-playground"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-or-later"
publish = false
description = "Application sandbox: Squirrel MCP adapter, interactive experiment runner, primal IPC client"
repository = "https://github.com/ecoPrimals/neuralSpring"

[dependencies]
anyhow = { workspace = true }
barracuda = { workspace = true, optional = true }
neural-spring = { path = ".." }
bytemuck = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "io-std", "net", "signal", "fs", "time"] }
toml = "0.8"
wgpu = { workspace = true, optional = true }

[features]
default = ["barracuda"]
barracuda = ["dep:barracuda", "dep:wgpu"]

[lints]
workspace = true

[[bin]]
name = "neuralspring_mcp_adapter"
path = "src/bin/neuralspring_mcp_adapter.rs"

[[bin]]
name = "neuralspring_interactive"
path = "src/bin/neuralspring_interactive.rs"

[[bin]]
name = "neuralspring_model_lab"
path = "src/bin/neuralspring_model_lab.rs"

[[bin]]
name = "neuralspring_bench_inference"
path = "src/bin/neuralspring_bench_inference.rs"

[[bin]]
name = "neuralspring_compute_probe"
path = "src/bin/neuralspring_compute_probe.rs"

[dev-dependencies]
temp-env = { workspace = true }
