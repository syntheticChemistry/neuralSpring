# neuralSpring Niche Deploy Graph (spring_deploy — Level 2+)
# Canonical deploy graph following SPRING_AS_NICHE_DEPLOYMENT_STANDARD.md
#
# This is the SPRING DEPLOY graph (spring binary + NUCLEUS primals for
# integration). It is RICHER than the proto-nucleate (which is pure primals
# only, no spring binary — Level 5 "primal proof").
#
# Proto-nucleate (upstream truth):
#   primalSpring/graphs/downstream/downstream_manifest.toml
#   [[downstream]] spring_name = "neuralspring"
#   fragments:  ["tower_atomic", "node_atomic", "meta_tier"]
#   depends_on: ["beardog", "songbird", "coralreef", "toadstool", "barracuda", "squirrel"]
#
# This deploy graph extends that with:
#   + nest_atomic (NestGate + provenance trio) for weight storage
#   + neuralspring binary node (the spring itself)
#   + provenance session nodes
#
# Fragments: tower_atomic, node_atomic, nest_atomic, meta_tier (superset of proto-nucleate)
# Bonding:   Metallic (InternalNucleus, UDS-only, BTSP at Tower)
#
# STATUS: V177 / S221 (Jun 1, 2026) — Wave 67 glacial cutover: P0 blockers investigated (Songbird security socket, biomeOS capability.call, bearDog S4). plasmidBin canonical launcher adopted.
# Run: biomeos deploy graphs/neuralspring_deploy.toml
#      biomeos niche deploy neuralspring-science

[graph]
id = "neuralspring_deploy"
description = "neuralSpring ML/spectral science + inference provider atop NUCLEUS composition"
coordination = "Sequential"

[graph.metadata]
neuralspring_version = "S223"
domain = "science"
target_node = "southgate"
blake3_hash = "2e4356464bdfa97c882f5c4239a11fbccc298725eb42eda0fb25273b63bdb198"
composition_model = "nucleated"
bond_type = "Metallic"
trust_model = "InternalNucleus"
transport = "uds"
tcp_ports = 0
encryption_boundary = "tower"
fragments = ["tower_atomic", "node_atomic", "nest_atomic", "meta_tier"]
proto_nucleate = "downstream_manifest::neuralspring"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 1: TOWER ATOMIC — BearDog (security) + Songbird (discovery)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "germinate_beardog"
output = "beardog_genesis"
capabilities = ["security", "crypto", "identity"]

[nodes.primal]
by_capability = "security"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
family_id = "${FAMILY_ID}"

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 10000

[[nodes]]
id = "germinate_songbird"
depends_on = ["germinate_beardog"]
output = "songbird_genesis"
capabilities = ["discovery", "mesh"]

[nodes.primal]
by_capability = "discovery"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
family_id = "${FAMILY_ID}"

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 15000

[[nodes]]
id = "germinate_skunkbat"
depends_on = ["germinate_beardog", "germinate_songbird"]
output = "skunkbat_genesis"
capabilities = ["defense", "threat", "metadata", "lineage", "baseline"]

[nodes.primal]
by_capability = "defense"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
family_id = "${FAMILY_ID}"
audit_forwarding = true

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 10000

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 2: NODE ATOMIC — coralReef (shader) + ToadStool (compute) + barraCuda (math)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "germinate_coralreef"
depends_on = ["germinate_songbird"]
output = "coralreef_genesis"
capabilities = ["shader.compile"]

[nodes.primal]
by_capability = "shader.compile.wgsl"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
family_id = "${FAMILY_ID}"

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 20000
fallback = "skip"

[[nodes]]
id = "germinate_toadstool"
depends_on = ["germinate_songbird"]
output = "toadstool_genesis"
capabilities = ["compute"]

[nodes.primal]
by_capability = "compute.dispatch.submit"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
features = ["gpu", "f64"]
family_id = "${FAMILY_ID}"

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 30000
fallback = "skip"

[nodes.substrate]
# 6/6 science pipeline stages are GPU-dispatchable (S211):
#   eigensolve, attention_anderson         → GpuOnly  (always GPU when present)
#   digester_anderson, isomorphic_reservoir,
#   wdm_ensemble_qs, introgression_nn      → GpuPreferred (GPU with CPU fallback)
#
# Mixed hardware routing:
#   - PCIe P2P detection at Dispatcher construction (sysfs IOMMU probe)
#   - NpuToGpuP2P substrate when P2P DMA available (bypass CPU roundtrip)
#   - CpuStaged transfer when no P2P (GPU→host→GPU)
#   - node.compute signal dispatch preferred in live composition mode
gpu_stages = 6
gpu_only_stages = ["eigensolve", "attention_anderson"]
gpu_preferred_stages = ["digester_anderson", "isomorphic_reservoir", "wdm_ensemble_qs", "introgression_nn"]
pcie_p2p_detection = true
node_compute_signal = true

[[nodes]]
id = "germinate_barracuda"
depends_on = ["germinate_songbird"]
output = "barracuda_genesis"
capabilities = ["math.tensor", "math.stats", "math.activation"]

[nodes.primal]
by_capability = "math.tensor"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
family_id = "${FAMILY_ID}"

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 20000
fallback = "skip"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 2b: NEST ATOMIC — NestGate (storage) + Provenance Trio (optional)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "germinate_nestgate"
depends_on = ["germinate_songbird"]
output = "nestgate_genesis"
capabilities = ["storage", "content", "data"]

[nodes.primal]
by_capability = "content.get"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
providers = ["ncbi", "zenodo", "pdb"]
storage_backend = "local_fs"
family_id = "${FAMILY_ID}"

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 20000
fallback = "skip"

[[nodes]]
id = "germinate_rhizocrypt"
depends_on = ["germinate_songbird"]
output = "rhizocrypt_genesis"
capabilities = ["dag"]

[nodes.primal]
by_capability = "dag.session.create"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
family_id = "${FAMILY_ID}"

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 15000
fallback = "skip"

[[nodes]]
id = "germinate_loamspine"
depends_on = ["germinate_songbird"]
output = "loamspine_genesis"
capabilities = ["commit"]

[nodes.primal]
by_capability = "commit.session"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
family_id = "${FAMILY_ID}"

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 15000
fallback = "skip"

[[nodes]]
id = "germinate_sweetgrass"
depends_on = ["germinate_songbird"]
output = "sweetgrass_genesis"
capabilities = ["provenance"]

[nodes.primal]
by_capability = "provenance.create_braid"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
family_id = "${FAMILY_ID}"

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 15000
fallback = "skip"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 2c: META-TIER — Squirrel (AI/inference routing)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "germinate_squirrel"
depends_on = ["germinate_songbird"]
output = "squirrel_genesis"
capabilities = ["ai.query", "inference"]

[nodes.primal]
by_capability = "ai.query"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
family_id = "${FAMILY_ID}"

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 20000
fallback = "skip"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 3: NEURALSPRING — ML/spectral science + inference provider
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "germinate_neuralspring"
depends_on = ["germinate_beardog", "germinate_songbird"]
output = "neuralspring_genesis"
capabilities = ["science", "inference"]

[nodes.primal]
by_capability = "science.spectral_analysis"

[nodes.operation]
name = "start"

[nodes.operation.params]
mode = "server"
family_id = "${FAMILY_ID}"

[nodes.operation.environment]
BIOMEOS_SOCKET_DIR = "${XDG_RUNTIME_DIR}/biomeos"
FAMILY_ID = "${FAMILY_ID}"

[nodes.constraints]
timeout_ms = 15000

[nodes.capabilities_provided]
# Science domain
"science.spectral_analysis" = "science.spectral_analysis"
"science.anderson_localization" = "science.anderson_localization"
"science.hessian_eigen" = "science.hessian_eigen"
"science.agent_coordination" = "science.agent_coordination"
"science.ipr" = "science.ipr"
"science.disorder_sweep" = "science.disorder_sweep"
"science.training_trajectory" = "science.training_trajectory"
"science.evoformer_block" = "science.evoformer_block"
"science.structure_module" = "science.structure_module"
"science.folding_health" = "science.folding_health"
"science.gpu_dispatch" = "science.gpu_dispatch"
"science.cross_spring_provenance" = "science.cross_spring_provenance"
"science.cross_spring_benchmark" = "science.cross_spring_benchmark"
"science.precision_routing" = "science.precision_routing"
# Inference (Squirrel composition — proto-nucleate inference.*)
"inference.complete" = "inference.complete"
"inference.embed" = "inference.embed"
"inference.models" = "inference.models"
# Health probes (biomeOS/Kubernetes pattern — deployment triad)
"health.liveness" = "health.liveness"
"health.readiness" = "health.readiness"
"health.check" = "health.check"
# Provenance tracking
"provenance.begin" = "provenance.begin"
"provenance.record" = "provenance.record"
"provenance.complete" = "provenance.complete"
"provenance.status" = "provenance.status"
# Niche deployment surface
"capability.list" = "capability.list"
"identity.get" = "identity.get"
"mcp.tools.list" = "mcp.tools.list"
"compute.offload" = "compute.offload"
"primal.forward" = "primal.forward"
"primal.discover" = "primal.discover"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 4: VALIDATION — health check the deployed niche
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "validate_neuralspring_atomic"
depends_on = ["germinate_beardog", "germinate_songbird", "germinate_neuralspring"]
output = "neuralspring_validated"

[nodes.operation]
name = "health_check"

[nodes.operation.params]
check_neuralspring = true
timeout_seconds = 15

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 5: PROVENANCE — record niche genesis (optional)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "provenance_session_start"
depends_on = ["validate_neuralspring_atomic"]
output = "provenance_session_id"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "provenance.session_create"
params = { agent = "neuralspring", experiment_id = "niche_deploy", version = "S200b", family_id = "neuralspring" }

[nodes.constraints]
timeout_ms = 10000
fallback = "skip"

[[nodes]]
id = "provenance_store_genesis"
depends_on = ["provenance_session_start"]
output = "genesis_stored"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "storage.put"
params = { key = "neuralspring:niche:deploy:${TIMESTAMP}", value = "${NEURALSPRING_GENESIS_JSON}", family_id = "neuralspring" }

[nodes.constraints]
timeout_ms = 10000
fallback = "skip"
